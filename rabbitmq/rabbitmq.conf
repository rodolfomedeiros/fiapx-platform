# Sem esta linha o definitions.json montado no container é ignorado, e a topologia
# (dead lettering e bindings) passa a depender do que cada serviço declara na conexão.
load_definitions = /etc/rabbitmq/definitions.json

# Sem isto o /metrics agrega todas as filas em um número só, e o painel de
# profundidade por fila não teria o rótulo queue. São três filas, o custo é baixo.
prometheus.return_per_object_metrics = true
