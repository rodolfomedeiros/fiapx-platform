global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8081"]

  - job_name: video-management-service
    static_configs:
      - targets: ["video-management-service:8000"]

  - job_name: video-processor-worker
    # dns_sd resolve todas as réplicas quando o Compose escala o worker;
    # static_configs pegaria só a primeira.
    dns_sd_configs:
      - names: ["video-processor-worker"]
        type: A
        port: 9100

  - job_name: notification-service
    static_configs:
      - targets: ["notification-service:9100"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
