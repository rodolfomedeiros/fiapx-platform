server {
  listen 80;
  client_max_body_size 500m;
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $auth_upstream http://auth-service:8081;
  set $video_upstream http://video-management-service:8000;
  set $web_upstream http://web:80;
  location ~ ^/auth/(.*)$ { proxy_pass $auth_upstream/api/v1/auth/$1$is_args$args; }
  location = /videos { proxy_pass $video_upstream/api/v1/videos$is_args$args; proxy_set_header Authorization $http_authorization; }
  # proxy_read_timeout cobre o WebSocket: sem ele, o padrão de 60s derrubaria a conexão
  # de um cliente que apenas espera a próxima transição de estado.
  location ~ ^/videos/(.*)$ { proxy_pass $video_upstream/api/v1/videos/$1$is_args$args; proxy_http_version 1.1; proxy_read_timeout 3600s; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /docs { proxy_pass $video_upstream/docs; }
  location /openapi.json { proxy_pass $video_upstream/openapi.json; }
  # Prefixo mais curto e sem regex: só recebe o que nenhuma das rotas acima casou.
  location / { proxy_pass $web_upstream; }
}
