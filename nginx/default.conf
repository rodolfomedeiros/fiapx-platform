server {
  listen 80;
  client_max_body_size 500m;
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $auth_upstream http://auth-service:8081;
  set $video_upstream http://video-management-service:8000;
  location ~ ^/auth/(.*)$ { proxy_pass $auth_upstream/api/v1/auth/$1$is_args$args; }
  location = /videos { proxy_pass $video_upstream/api/v1/videos; proxy_set_header Authorization $http_authorization; }
  location ~ ^/videos/(.*)$ { proxy_pass $video_upstream/api/v1/videos/$1$is_args$args; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
  location /docs { proxy_pass $video_upstream/docs; }
  location /openapi.json { proxy_pass $video_upstream/openapi.json; }
}
