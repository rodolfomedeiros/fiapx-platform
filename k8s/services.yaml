apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: auth-service
          image: fiapx/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081, name: http }]
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://postgres:5432/fiapx
            - name: DATABASE_USERNAME
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: POSTGRES_USER } }
            - name: DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: JWT_SECRET } }
          startupProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fiapx
spec:
  selector: { app: auth-service }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-management-service
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels: { app: video-management-service }
  template:
    metadata:
      labels: { app: video-management-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: video-management-service
          image: fiapx/video-management-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: fiapx-config }
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/fiapx
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: POSTGRES_PASSWORD } }
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_SECRET_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: video-management-service
  namespace: fiapx
spec:
  selector: { app: video-management-service }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-processor-worker
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels: { app: video-processor-worker }
  template:
    metadata:
      labels: { app: video-processor-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      # O worker precisa terminar o vídeo em curso antes de sair, senão a mensagem
      # volta para a fila e o trabalho é refeito do zero.
      terminationGracePeriodSeconds: 120
      containers:
        - name: video-processor-worker
          image: fiapx/video-processor-worker:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9100, name: metrics }]
          envFrom:
            - configMapRef: { name: fiapx-config }
          env:
            - name: PREFETCH
              value: "4"
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: fiapx-secrets, key: S3_SECRET_KEY } }
          readinessProbe:
            tcpSocket: { port: 9100 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: video-processor-worker
  namespace: fiapx
spec:
  clusterIP: None
  selector: { app: video-processor-worker }
  ports: [{ name: metrics, port: 9100, targetPort: 9100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: notification-service
          image: fiapx/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 9100, name: metrics }]
          envFrom:
            - configMapRef: { name: fiapx-config }
          readinessProbe:
            httpGet: { path: /health, port: 9100 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fiapx
spec:
  selector: { app: notification-service }
  ports: [{ name: metrics, port: 9100, targetPort: 9100 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        # Nginx servindo o bundle já compilado: não fala com o banco nem com o broker,
        # e por isso não tem configuração de ambiente nenhuma. O endereço da API é o
        # próprio host de onde a página veio, resolvido pelo Ingress.
        - name: web
          image: fiapx/web:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80, name: http }]
          readinessProbe:
            httpGet: { path: /health, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 80 }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fiapx
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
